[project]
name = "lecture-forge"
version = "0.1.0"
description = "Turn textbook chapters into chalkboard-free audio lectures"
readme = "README.md"
authors = [
    { name = "frankbria", email = "frank.bria@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "openai>=3.24.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
lecture-forge = "lecture_forge.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = ["integration: calls real external services (LLM / ElevenLabs)"]

[tool.coverage.run]
source = ["lecture_forge"]
